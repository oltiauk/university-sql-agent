<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:#F7F9FC;color:#1B2333;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F6BFF;outline-offset:2px}
h1,p{margin:0}
[hidden]{display:none !important}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;padding:32px 28px 28px;background:#FFFFFF;border-radius:28px;box-shadow:0 24px 60px rgba(40,80,150,.07)}
.top{display:flex;flex-direction:column;align-items:center;gap:18px}
.orb{width:64px;height:64px;border-radius:999px;background:radial-gradient(circle at 62% 38%,#FFC83A 0%,#FF8A2A 34%,#FF5A4E 62%,#FFD9D2 100%);box-shadow:0 10px 30px rgba(255,120,60,.3)}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center}
.switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:#EEF3FB;border-radius:999px}
.switch button{height:34px;padding:0 8px;font-size:13px;font-weight:500;color:#1B2333;background:transparent;border:0;border-radius:999px}
.switch button[aria-pressed="true"]{background:#FFFFFF;box-shadow:0 2px 8px rgba(40,80,150,.14)}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:500}
.field input{height:42px;padding:0 16px;font-size:14px;color:#1B2333;background:#F4F7FB;border:0;border-radius:16px}
.note{font-size:12px;color:#5B6676}
.models{display:flex;flex-direction:column;gap:6px}
.models button{display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#1B2333;background:#F4F7FB;border:0;border-radius:14px}
.models button svg{visibility:hidden}
.models button[aria-pressed="true"]{background:#E3ECFA}
.models button[aria-pressed="true"] svg{visibility:visible}
.start{display:flex;align-items:center;justify-content:center;height:42px;font-size:14px;font-weight:500;color:#FFFFFF;background:#1B2333;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="top">
<span class="orb" aria-hidden="true"></span>
<h1>Which AI should answer?</h1>
</div>

<div class="switch" id="providers">
<button type="button" data-p="claude" aria-pressed="true">Claude</button>
<button type="button" data-p="openai" aria-pressed="false">OpenAI</button>
<button type="button" data-p="ollama" aria-pressed="false">Ollama</button>
</div>

<div class="field" id="keyField">
<label class="label" for="key">API key</label>
<input id="key" type="password" autocomplete="off">
<p class="note">Kept until you close this page. Never saved.</p>
</div>

<div class="field" id="modelField" hidden>
<span class="label">Model</span>
<div class="models" id="models">
<button type="button" aria-pressed="true"><span>llama3.1</span><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"></path></svg></button>
<button type="button" aria-pressed="false"><span>qwen2.5-coder</span><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"></path></svg></button>
<button type="button" aria-pressed="false"><span>mistral</span><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"></path></svg></button>
</div>
</div>

<a class="start" href="sql-agent-ui.html">Start</a>
</div>

<script>
(function () {
function group(id, onPick) {
  var box = document.getElementById(id);
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    box.querySelectorAll('button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    if (onPick) onPick(b);
  });
}
group('providers', function (b) {
  var local = b.getAttribute('data-p') === 'ollama';
  document.getElementById('keyField').hidden = local;
  document.getElementById('modelField').hidden = !local;
});
group('models');
})();
</script>
</body>
</html>
